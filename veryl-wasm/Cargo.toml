[package]
name = "veryl-wasm"
version = "2.33.0"
edition = "2021"
description = "WebAssembly build of veryl-sim + veryl-eda + veryl-emu for the browser environment"
# only for the web build (web/dist), not published
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
veryl-parser = "0.22"
veryl-sim = { package = "veryl2chip-sim", path = "../veryl-sim" }
veryl-eda = { package = "veryl2chip-eda", path = "../veryl-eda" }
veryl-emu = { package = "veryl2chip-emu", path = "../veryl-emu" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
