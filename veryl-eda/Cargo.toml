[package]
name = "veryl2chip-eda"
version = "2.8.0"
edition = "2021"
description = "Veryl HDL to chip: synthesis, iCE40 FPGA place & route and bitstream, ASIC standard-cell flow (vlib or SkyWater SKY130, to a DRC-clean GDS); part of veryl2chip"
license = "MIT"
repository = "https://github.com/ccc-eda/veryl2chip"
homepage = "https://ccc-eda.github.io/veryl2chip/web/dist/index.html"
readme = "README.md"
keywords = ["veryl", "eda", "synthesis", "fpga", "asic"]
categories = ["development-tools", "command-line-utilities", "simulation"]

# the library and the command keep their short names: `use veryl_eda`, `veryl-eda a.veryl`
[lib]
name = "veryl_eda"

[[bin]]
name = "veryl-eda"
path = "src/main.rs"

# one command for everything, git style: v2c sim / synth / fpga / asic / gatesim / cc / pdk
[[bin]]
name = "v2c"
path = "src/bin/v2c.rs"

[dependencies]
veryl-parser = "0.22"
veryl-sim = { package = "veryl2chip-sim", path = "../veryl-sim", version = "2.8.0" }
