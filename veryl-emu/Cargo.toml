[package]
name = "veryl2chip-emu"
version = "2.36.0"
edition = "2021"
description = "Compiles Veryl designs to WebAssembly for fast cycle-based simulation, part of veryl2chip"
license = "MIT"
repository = "https://github.com/ccc-eda/veryl2chip"
publish = false

[lib]
name = "veryl_emu"

[[bin]]
name = "veryl-emu"
path = "src/main.rs"

[dependencies]
veryl-parser = "0.22"
veryl-sim = { package = "veryl2chip-sim", path = "../veryl-sim", version = "2.36.0" }

[profile.release]
debug = false
